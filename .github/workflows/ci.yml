name: CI

on:
  push:
    branches:
      - '**' #double star includes a '/'.  single star doesnt match a '/'
    tags:
      - '**' #double star includes a '/'.  single star doesnt match a '/'
  schedule:
    # Daily at 05:44
    - cron: '44 5 * * *'

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.8"
  AWS_REGION: us-east-2

jobs:
  build:
    name: CI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Venv
        run: |
          #install Poetry
          python3 -m ensurepip
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry==1.5.1

          poetry --version

          poetry config virtualenvs.in-project true
          poetry config virtualenvs.path .

          #Setup AWS Connection
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain epc-power-us --domain-owner ${{ secrets.AWS_ACCOUNT_ID }} --query authorizationToken --output text)
          echo "::add-mask::$CODEARTIFACT_AUTH_TOKEN"
          poetry config repositories.epc-power https://epc-power-us-${{ secrets.AWS_ACCOUNT_ID }}.d.codeartifact.us-east-2.amazonaws.com/pypi/epc-power/
          poetry config repositories.third-party https://epc-power-us-${{ secrets.AWS_ACCOUNT_ID }}.d.codeartifact.us-east-2.amazonaws.com/pypi/third-party/
          # Pass credentials via env vars instead of `poetry config http-basic`, which on Windows
          # stores them in Credential Manager and fails for tokens over ~1280 chars (CredWrite 1783).
          # Written to $GITHUB_ENV so the publish step also has them.
          {
            echo "POETRY_HTTP_BASIC_EPC_POWER_USERNAME=aws"
            echo "POETRY_HTTP_BASIC_EPC_POWER_PASSWORD=$CODEARTIFACT_AUTH_TOKEN"
            echo "POETRY_HTTP_BASIC_THIRD_PARTY_USERNAME=aws"
            echo "POETRY_HTTP_BASIC_THIRD_PARTY_PASSWORD=$CODEARTIFACT_AUTH_TOKEN"
          } >> "$GITHUB_ENV"
          export POETRY_HTTP_BASIC_EPC_POWER_USERNAME=aws
          export POETRY_HTTP_BASIC_EPC_POWER_PASSWORD=$CODEARTIFACT_AUTH_TOKEN
          export POETRY_HTTP_BASIC_THIRD_PARTY_USERNAME=aws
          export POETRY_HTTP_BASIC_THIRD_PARTY_PASSWORD=$CODEARTIFACT_AUTH_TOKEN
          poetry config installer.max-workers 1    # https://github.com/python-poetry/poetry/issues/7611

          poetry self add "poetry-dynamic-versioning[plugin]"
          poetry install
          poetry --version
      - name: python commands
        run: |
          set -vx
          poetry run pip --version
          poetry run black --check --diff .
          poetry run genbuildinfo "epyqlib/_build_generated.py"
          poetry run pip freeze --all
          poetry run builduiepyqlib
          poetry run pytest -vvvv -s --no-qt-log --run-factory epyqlib.tests --pyargs

          poetry build
      - name: Verify publish credentials
        # Runs as its own step so it checks the credentials carried over via $GITHUB_ENV,
        # the same way the publish step receives them.
        run: |
          for var in POETRY_HTTP_BASIC_EPC_POWER_USERNAME POETRY_HTTP_BASIC_EPC_POWER_PASSWORD; do
            if [ -z "${!var}" ]; then echo "::error::$var is not set"; exit 1; fi
          done
          curl --fail --silent --show-error --output /dev/null \
            --user "$POETRY_HTTP_BASIC_EPC_POWER_USERNAME:$POETRY_HTTP_BASIC_EPC_POWER_PASSWORD" \
            https://epc-power-us-${{ secrets.AWS_ACCOUNT_ID }}.d.codeartifact.us-east-2.amazonaws.com/pypi/epc-power/simple/
          poetry publish --repository epc-power --dry-run
      - name: Publish executable
        #only run if a new tag is created
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          poetry publish --repository epc-power
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: epyq_st
          path: |
            dist/*
